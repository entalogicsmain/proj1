[project]
name = "freelance-agent"
version = "0.1.0"
description = "Semi-autonomous freelance engineer: Worker, Judge, Manager, Questioner agents behind one orchestrator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fa = "freelance_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
